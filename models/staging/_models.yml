version: 2

models:
  - name: stg_customers
    description: "Clients nettoyés depuis la source brute. Un client par ligne."
    columns:
      - name: customer_id
        description: "Identifiant unique du client."
        data_tests:
          - unique
          - not_null
      - name: email
        description: "Email du client, mis en minuscules."
        data_tests:
          - not_null

  - name: stg_orders
    description: "Commandes nettoyées depuis la source brute. Une commande par ligne."
    columns:
      - name: order_id
        description: "Identifiant unique de la commande."
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: "Client qui a passé la commande. Référence stg_customers."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: statut
        description: "Statut de la commande : completed ou pending."
        data_tests:
          - accepted_values:
              arguments:
                values: ['completed', 'pending']
          - relationships:
              arguments:
                to: ref('statuts_commande')
                field: statut